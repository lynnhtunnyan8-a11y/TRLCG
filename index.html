<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09080e"><meta name="description" content="Browse and shop from local stores with TRLCG Self-Service Shopping."><title>Dar Dar Collections — Shop Management System</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23f5f4f6'/%3E%3Ctext x='20' y='27' text-anchor='middle' font-family='sans-serif' font-size='22' font-weight='800' fill='%23111'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09080e;--panel:#111016;--hover:#18171e;--line:#28262f;--muted:#77747f;--text:#f4f3f6;--soft:#aaa7b1;--white:#f7f6f7;--green:#94c4a4;font-family:'DM Sans','Noto Sans Myanmar',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit}.page{width:min(100%,1440px);margin:auto;padding:16px 17px 48px}.brand{display:flex;align-items:center;gap:7px;height:26px;font-size:10px;font-weight:800;letter-spacing:2.6px}.brand-mark{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#f5f4f6;color:#111;font-size:13px;font-weight:800;letter-spacing:0}.intro{margin-top:16px;border-left:2px solid #f5f4f6;padding-left:12px}.eyebrow{margin:0 0 3px;color:#b1adb8;font-size:9px;font-weight:600;letter-spacing:2.3px;text-transform:uppercase}.intro h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.4px;font-weight:750}.burmese{font-family:'Noto Sans Myanmar','DM Sans',sans-serif}.intro .burmese{margin:5px 0 0;color:#7e7b85;font-size:11px;line-height:1.7}.search{position:relative;width:min(320px,100%);margin-top:16px}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#74717b}.search input{width:100%;height:32px;padding:0 12px 0 30px;border:1px solid var(--line);border-radius:11px;outline:none;background:#141219;color:var(--text);font-size:12px}.search input:focus,.field input:focus{border-color:#77727f;box-shadow:0 0 0 3px #ffffff0c}.search input::placeholder,.field input::placeholder{color:#77747f}.count{margin:33px 0 11px;color:#85818b;font-size:9px;letter-spacing:1.25px;text-transform:uppercase}.shops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.shop{min-height:157px;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);text-align:left;cursor:pointer;transition:background .18s,border .18s,transform .18s}.shop:hover{background:var(--hover);border-color:#48444f;transform:translateY(-2px)}.shop-top{display:flex;align-items:center;gap:11px}.shop-logo{display:grid;place-items:center;flex:none;width:68px;height:68px;border:1px solid #ffffff0b;border-radius:12px;background:#28262d;color:#bbb8c2}.shop-logo svg{width:29px;height:29px}.fresh{background:#e8f4ef;color:#397062;font-size:9px;font-weight:800;line-height:1.05;text-align:center;letter-spacing:-.4px}.shop h2{margin:0 0 3px;font-size:14px;letter-spacing:.1px;font-weight:700}.phone{margin:0;color:#82808a;font-size:11px;letter-spacing:.15px}.address{display:flex;align-items:center;gap:6px;margin:12px 0 0;color:#8a8791;font-size:10px}.address svg{width:12px;height:12px;flex:none}.shop-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:#8c8993;font-size:9px;letter-spacing:.45px;text-transform:uppercase}.shop-foot svg{width:14px;height:14px;color:#c6c3cb}.empty{padding:30px 0;color:var(--muted);font-size:13px}.auth-page{min-height:100vh;padding:0 5.55%;display:flex;flex-direction:column}.auth-content{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8%;padding-bottom:32px}.welcome{max-width:470px}.welcome .eyebrow{border-left:2px solid white;padding:7px 0 7px 12px;margin-bottom:19px}.welcome h1{font-size:clamp(48px,7vw,72px);line-height:1;letter-spacing:10px;margin:0 0 13px;font-weight:800}.welcome h2{font-size:19px;margin:0 0 13px}.welcome p{max-width:390px;color:#77747f;line-height:1.8;margin:0}.welcome .burmese{margin-top:8px}.auth-card{width:min(100%,400px);justify-self:end}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#15141a;border:1px solid #28262e;border-radius:14px;padding:3px;margin-bottom:17px}.tabs button{border:0;border-radius:10px;background:transparent;color:#9e9aa4;height:27px;font-size:10px;font-weight:700;letter-spacing:.7px;cursor:pointer}.tabs button.active{background:#f5f4f5;color:#18171b}.auth-card h2{margin:0;font-size:19px;letter-spacing:-.4px}.sub{color:#77747f;font-size:11px;margin:5px 0 18px}.field{margin:0 0 10px}.field label{display:block;color:#9b97a2;font-size:8px;letter-spacing:1px;margin-bottom:5px}.field input{width:100%;height:33px;border:1px solid #504d57;border-radius:10px;background:#100f15;color:var(--text);outline:none;padding:0 12px;font-size:12px}.password{position:relative}.password input{padding-right:40px}.reveal{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:none;color:#9b97a2;padding:3px;cursor:pointer}.submit{width:100%;height:34px;margin-top:1px;border:0;border-radius:10px;background:#f5f4f5;color:#17161b;font-size:10px;font-weight:800;letter-spacing:.8px;cursor:pointer}.submit:hover{background:#dedde0}.auth-error{color:#f0949d;font-size:11px;min-height:17px;margin:4px 0}.switch-line{font-size:10px;color:#7c7883;margin:10px 0 17px}.text-btn{border:0;background:none;color:#f0edf1;font-size:10px;font-weight:700;cursor:pointer;padding:0}.selected-shop{height:31px;border:1px solid #29272f;background:#15141a;border-radius:10px;display:grid;place-items:center;color:#c2bec8;font-size:12px}.switch-shop{display:block;margin:8px auto 0;border:0;background:transparent;color:#c0bdc7;font-size:10px;letter-spacing:1px;cursor:pointer}.auth-footer{display:flex;align-items:center;justify-content:space-between;padding:15px 0 58px;color:#5e5b65;font-size:10px;letter-spacing:2px}.dots{letter-spacing:4px}.store-head{display:flex;align-items:center;justify-content:space-between;padding:22px 0 28px;border-bottom:1px solid var(--line)}.store-name{font-size:20px;margin:0 0 4px}.store-head p{margin:0;color:var(--muted);font-size:12px}.store-actions{display:flex;align-items:center;gap:9px}.outline-btn,.cart-btn{border:1px solid var(--line);background:#121117;border-radius:10px;padding:9px 13px;cursor:pointer}.cart-btn{background:#f3f1f3;color:#17161b;font-weight:700}.catalog-title{font-size:24px;margin:27px 0 4px}.catalog-sub{color:var(--muted);margin:0 0 18px;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid var(--line);border-radius:99px;background:#121117;color:#aaa6b0;padding:7px 14px;font-size:11px;cursor:pointer}.filter.active{background:#f2f1f2;color:#151419;border-color:#f2f1f2}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.product{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.product-art{height:190px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#37333b,#19171d 72%);font-size:64px}.product-info{padding:13px}.product-info h3{margin:0 0 5px;font-size:13px}.product-meta{display:flex;align-items:center;justify-content:space-between;color:#aaa6b0;font-size:11px}.add{width:100%;margin-top:12px;border:1px solid #393640;border-radius:8px;background:#19171e;padding:8px;cursor:pointer;font-size:11px}.add:hover{background:#25232a}.scrim{position:fixed;inset:0;background:#0009;z-index:5;display:flex;justify-content:flex-end}.drawer{width:min(420px,100%);height:100%;padding:24px;background:#100f15;border-left:1px solid var(--line);display:flex;flex-direction:column}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0;font-size:19px}.close{border:1px solid var(--line);background:#19171e;border-radius:8px;width:32px;height:32px;cursor:pointer}.cart-lines{flex:1;overflow:auto;margin-top:16px}.cart-line{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.cart-line small{display:block;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:25px;height:25px;border:1px solid var(--line);background:#19171e;border-radius:6px;cursor:pointer}.cart-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:16px 0;font-weight:700}.checkout{height:42px;border:0;border-radius:9px;background:#f3f1f3;color:#17161b;font-weight:800;cursor:pointer}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:#1a181f;color:white;z-index:10;font-size:12px;box-shadow:0 10px 35px #0008}.hidden{display:none!important}
@media(max-width:700px){.page{padding:14px 14px 36px}.shops{grid-template-columns:1fr}.shop{min-height:145px}.shop-foot{margin-top:14px}.count{margin-top:26px}.auth-page{padding:0 22px}.auth-content{grid-template-columns:1fr;gap:27px;padding:56px 0 26px;align-content:center}.welcome h1{font-size:47px;letter-spacing:7px}.welcome h2{font-size:17px}.auth-card{justify-self:stretch;width:100%;max-width:440px;margin:auto}.auth-footer{padding-bottom:22px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-art{height:145px;font-size:52px}.store-head{align-items:flex-start;gap:12px}.store-actions{flex-direction:column;align-items:stretch}.outline-btn,.cart-btn{white-space:nowrap;padding:8px}.catalog-title{font-size:21px}}@media(min-width:1200px){.shops{gap:12px}.shop{padding:18px}}
</style>
</head>
<body><main id="app"></main><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';const shops=[{id:'crystal',name:'Crystal Fresh',phone:'943007266',address:'သာကေတ ရန်ပြေ၄လမ်းအနောက်',fresh:true},{id:'dardar',name:'Dar Dar Collections',phone:'9674776290',address:'သာကေတ'},{id:'trlcg',name:'T R L C G',phone:'9674776290',address:'သာကေတ'}];const products=[{name:'Everyday Cotton Tee',category:'Clothing',price:12000,art:'👕'},{name:'Classic Shoulder Bag',category:'Bags',price:24500,art:'👜'},{name:'Soft Knit Cardigan',category:'Clothing',price:32000,art:'🧥'},{name:'Minimal Hair Clip Set',category:'Accessories',price:6500,art:'🎀'},{name:'Canvas Tote',category:'Bags',price:14500,art:'🛍️'},{name:'Pearl Stud Earrings',category:'Accessories',price:9000,art:'✨'},{name:'Linen Summer Shirt',category:'Clothing',price:22000,art:'👚'},{name:'Daily Crossbody',category:'Bags',price:28000,art:'👝'}];let view='shops',shop=null,mode='signin',filter='All',query='',cart={},showPass=false;const app=document.querySelector('#app'),toastEl=document.querySelector('#toast');const shopIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-1.6-6H4.6L3 10Z"/><path d="M5 10v10h14V10M9 20v-6h6v6M3 10c0 1.5 1 2.5 2.5 2.5S8 11.5 8 10c0 1.5 1 2.5 2.5 2.5S13 11.5 13 10c0 1.5 1 2.5 2.5 2.5S18 11.5 18 10c0 1.5 1 2.5 2.5 2.5S23 11.5 23 10"/></svg>',pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>',fmt=n=>new Intl.NumberFormat('en-US').format(n);function toast(t){toastEl.textContent=t;toastEl.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>toastEl.classList.add('hidden'),2400)}function render(){if(view==='shops')renderShops();else if(view==='auth')renderAuth();else renderStore()}
function renderShops(){app.innerHTML=`<div class="page"><div class="brand"><span class="brand-mark">T</span><span>T R L C G</span></div><header class="intro"><p class="eyebrow">Self-Service Shopping</p><h1>Select a Shop</h1><p class="burmese">စျေးဝယ်လိုသော ဆိုင်ကို ရွေးချယ်ပါ</p></header><label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg><input id="shopSearch" type="search" placeholder="Search shops by name, address, or phone..." value="${escapeHtml(query)}" aria-label="Search shops"></label><p class="count">${shops.filter(s=>matches(s,query)).length} shops available</p><section class="shops">${shops.filter(s=>matches(s,query)).map(s=>`<button class="shop" data-shop="${s.id}"><div class="shop-top"><span class="shop-logo ${s.fresh?'fresh':''}">${s.fresh?'Crystal<br>Fresh':shopIcon}</span><span><h2>${s.name}</h2><p class="phone">${s.phone}</p></span></div><p class="address">${pin}${s.address}</p><div class="shop-foot"><span>Enter Shop</span>${arrow}</div></button>`).join('')||'<p class="empty">No shops found. Try another search.</p>'}</section></div>`;document.querySelector('#shopSearch').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;renderShops();const input=document.querySelector('#shopSearch');input.focus();input.setSelectionRange(pos,pos)});document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{shop=shops.find(s=>s.id===b.dataset.shop);mode='signin';view='auth';render()})}
function matches(s,q){return `${s.name} ${s.address} ${s.phone}`.toLowerCase().includes(q.toLowerCase())}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderAuth(){app.innerHTML=`<div class="auth-page"><section class="auth-content"><div class="welcome"><p class="eyebrow">Self-Service Shopping</p><h1>T R L C G</h1><h2>Shop from your phone</h2><p>Browse our catalog, add items to your cart, and place orders yourself. Quick, easy, and contactless.</p><p class="burmese">ဖုန်းဖြင့်တိုက်ရိုက်မှာယူနိုင်သော ဝန်ဆောင်မှု</p></div><div class="auth-card"><div class="tabs"><button class="${mode==='signin'?'active':''}" data-mode="signin">⇥ &nbsp; SIGN IN</button><button class="${mode==='register'?'active':''}" data-mode="register">♙ &nbsp; REGISTER</button></div><h2>${mode==='signin'?'Welcome back':'Create an account'}</h2><p class="sub">${mode==='signin'?'Sign in to start shopping':'Register to start shopping'}</p><form id="authForm">${mode==='register'?'<div class="field"><label for="fullname">FULL NAME</label><input id="fullname" name="fullname" placeholder="Your name" autocomplete="name" required></div>':''}<div class="field"><label for="username">USERNAME</label><input id="username" name="username" placeholder="username" autocomplete="username" required></div><div class="field"><label for="password">PASSWORD</label><div class="password"><input id="password" name="password" type="${showPass?'text':'password'}" placeholder="••••••" autocomplete="${mode==='signin'?'current-password':'new-password'}" required><button type="button" class="reveal" aria-label="Show password">${showPass?'◉':'◎'}</button></div></div>${mode==='register'?'<div class="field"><label for="phone">PHONE NUMBER</label><input id="phone" name="phone" type="tel" placeholder="09xxxxxxxxx" autocomplete="tel" required></div>':''}<p class="auth-error" id="authError" aria-live="polite"></p><button class="submit" type="submit">${mode==='signin'?'SIGN IN':'CREATE ACCOUNT'}</button></form><p class="switch-line">${mode==='signin'?`Don't have an account? <button class="text-btn" data-mode="register">Register</button>`:`Already have an account? <button class="text-btn" data-mode="signin">Sign In</button>`}</p><div class="selected-shop">${shop.name}</div><button class="switch-shop" id="switchShop">← &nbsp; SWITCH SHOP</button></div></section><footer class="auth-footer"><span>© 2026 · T R L C G</span><span class="dots">•••</span><span></span></footer></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderAuth()});document.querySelector('.reveal').onclick=()=>{showPass=!showPass;renderAuth();document.querySelector('#password').focus()};document.querySelector('#switchShop').onclick=()=>{view='shops';render()};document.querySelector('#authForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(mode==='register'){toast('Your account is ready. Please sign in.');mode='signin';renderAuth();return}if(!fd.get('username')||!fd.get('password')){document.querySelector('#authError').textContent='Enter your username and password';return}view='store';renderStore()}}
function renderStore(){const cats=['All','Clothing','Bags','Accessories'];const shown=products.filter(p=>(filter==='All'||p.category===filter)&&p.name.toLowerCase().includes(query.toLowerCase()));app.innerHTML=`<div class="page"><div class="brand"><span class="brand-mark">T</span><span>T R L C G</span></div><header class="store-head"><div><h1 class="store-name">${shop.name}</h1><p>Self-Service Shopping · ${shop.address}</p></div><div class="store-actions"><button class="outline-btn" id="backShop">Switch shop</button><button class="cart-btn" id="openCart">Cart (${Object.values(cart).reduce((a,b)=>a+b,0)})</button></div></header><h2 class="catalog-title">Shop our collection</h2><p class="catalog-sub">A few favorites picked for you.</p><label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg><input id="productSearch" placeholder="Search products..." value="${escapeHtml(query)}"></label><div class="filters">${cats.map(c=>`<button class="filter ${c===filter?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><section class="products">${shown.map((p,i)=>`<article class="product"><div class="product-art" aria-hidden="true">${p.art}</div><div class="product-info"><h3>${p.name}</h3><div class="product-meta"><span>${p.category}</span><strong>${fmt(p.price)} Ks</strong></div><button class="add" data-add="${products.indexOf(p)}">Add to cart</button></div></article>`).join('')||'<p class="empty">No products found.</p>'}</section></div>`;document.querySelector('#backShop').onclick=()=>{view='shops';query='';render()};document.querySelector('#openCart').onclick=openCart;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderStore()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add;cart[id]=(cart[id]||0)+1;renderStore();toast('Added to your cart')});document.querySelector('#productSearch').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;renderStore();const i=document.querySelector('#productSearch');i.focus();i.setSelectionRange(pos,pos)})}
function openCart(){const lines=Object.entries(cart).filter(([,n])=>n>0);const total=lines.reduce((sum,[id,n])=>sum+products[id].price*n,0);const modal=document.createElement('div');modal.className='scrim';modal.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-label="Your cart"><div class="drawer-head"><h2>Your cart</h2><button class="close" aria-label="Close cart">×</button></div><div class="cart-lines">${lines.length?lines.map(([id,n])=>`<div class="cart-line"><div>${products[id].name}<small>${fmt(products[id].price)} Ks each</small></div><div class="qty"><button data-dec="${id}" aria-label="Remove one">−</button><span>${n}</span><button data-inc="${id}" aria-label="Add one">+</button></div></div>`).join(''):'<p class="empty">Your cart is empty.</p>'}</div><div class="cart-total"><span>Total</span><span>${fmt(total)} Ks</span></div><button class="checkout" ${lines.length?'':'disabled'}>Place order</button></aside>`;document.body.appendChild(modal);modal.querySelector('.close').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.querySelectorAll('[data-dec],[data-inc]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec??b.dataset.inc;cart[id]=(cart[id]||0)+(b.dataset.inc?1:-1);if(cart[id]<=0)delete cart[id];modal.remove();renderStore();openCart()});modal.querySelector('.checkout').onclick=()=>{if(!lines.length)return;cart={};modal.remove();renderStore();toast('Order placed! The shop will contact you shortly.')};document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){modal.remove();document.removeEventListener('keydown',esc)}})}render();})();
</script></body></html>
